services:
  # ========================================================
  # 1. AI & RAG Microservice (Python FastAPI)
  # ========================================================
  - type: web
    name: niveshrakshak-ai
    env: python
    region: oregon
    plan: free
    rootDir: ai-service
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.9

  # ========================================================
  # 2. Node.js Express Orchestration Backend
  # ========================================================
  - type: web
    name: niveshrakshak-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: niveshrakshak-ai
          property: host
      - key: JWT_SECRET
        generateValue: true

  # ========================================================
  # 3. React + Vite Frontend (Static Web Site)
  # ========================================================
  - type: web
    name: niveshrakshak-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: niveshrakshak-backend
          property: host

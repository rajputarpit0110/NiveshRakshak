services:
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: niveshrakshak-ai
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped
    volumes:
      - ./data/rag_data:/app/../data/rag_data:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: niveshrakshak-backend
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=niveshrakshak_super_secret_jwt_key_2024
    depends_on:
      - ai-service
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5001/api
    container_name: niveshrakshak-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
